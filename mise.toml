# This repository's own tasks; node, pnpm and oxlint are the workspace's, read by walking up.
[env]
_.path = ["{{config_root}}/node_modules/.bin"]

# What oxfmt formats here; ReScript's formatter takes its sources from rescript.json.
[vars]
formatted = "README.md package.json rescript.json"

[tasks.fmt]
description = "Format the glue with ReScript's formatter and the prose with oxfmt: `fmt [--dry-run]`"
usage = 'flag "-n --dry-run" help="List what is not formatted and write nothing"'
run = """
if [ -z "${usage_dry_run:-}" ]; then rescript format && oxfmt {{vars.formatted}}; exit; fi
rescript format --check; oxfmt --list-different {{vars.formatted}}; exit 0
"""

[tasks.build]
description = "Compile the glue under .github/publish/ and its tests"
run = "rescript build"

[tasks.description]
description = "Write the repository's description to GITHUB_OUTPUT for Docker Hub"
depends = ["build"]
run = "node scripts/description.res.mjs"

[tasks.publish]
description = "Build each runtime upstream released past the delay that no release here lists, push it to Docker Hub and name it in dist/built.json: `publish [--dry-run]`"
usage = 'flag "-n --dry-run" help="Read upstream and hash the downloads, and build, push and write nothing"'
depends = ["build", "//:build"]
run = 'node .github/publish/publish.res.mjs ${usage_dry_run:+--dry-run}'

# The day's release on GitHub, the workspace's scripts/release reading workspace.toml's [release].
[tasks.release]
description = "Put what dist/built.json names into the UTC day's release here: `release [--dry-run]`"
usage = 'flag "-n --dry-run" help="Say what would be released and change nothing on GitHub"'
depends = ["//:build"]
run = 'node {{env.WORKSPACE}}/scripts/release/release.res.mjs ${usage_dry_run:+--dry-run}'

# Its packages, actions and base images are the workspace's movers, workspace.toml's [update].
[tasks.update]
description = "Move each Dockerfile's runtime to the newest version released here: `update [--dry-run] [--major]`"
usage = '''
flag "-n --dry-run" help="Say what would move and write nothing"
flag "--major" help="Taken by the workspace's movers; a runtime moves to the newest released here regardless"
'''
depends = ["build", "//:build"]
run = "node scripts/pins.res.mjs ${usage_dry_run:+--dry-run}"

[tasks.clean]
description = "Remove what ReScript compiled and the archives a build wrote, never an installed dependency: `clean [--dry-run]`"
usage = 'flag "-n --dry-run" help="List what would go and remove nothing"'
depends = ["//:build"]
run = "node {{env.WORKSPACE}}/scripts/clean.res.mjs"

[tasks.verify]
description = "What a commit has to pass: everything formatted, the glue's tests and the bake file read; the workflow is the workspace's check"
depends = ["build"]
run = [
	"rescript format --check && oxfmt --check {{vars.formatted}}",
	"node --test '.github/publish/tests/**/*.res.mjs' 'scripts/tests/**/*.res.mjs'",
	"cd images && docker buildx bake --print --progress=quiet > /dev/null",
]
