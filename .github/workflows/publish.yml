# Weekly, by hand, or on a push to main, builds each runtime upstream released past the delay that
# no release here holds, pushes it to Docker Hub and releases it by the workspace's scripts/release.
name: publish

on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

# A run started while another builds waits behind it in order, up to a hundred deep, and none is
# canceled, so two never race to release one day, as rdm's nightly queues.
concurrency:
  group: publish
  queue: max

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The workspace above the repository, as it is checked out at home, whose mise.toml pins node.
      - uses: canmi21/canmi/.github/actions/workspace@main
        with:
          path: monoflake/runtime
          scripts: true
      # The OCI exporter needs a builder of its own, which the docker driver is not.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Docker Hub takes each image under the author's own account, RFC m7rkq.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: canmi
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build
        working-directory: repos/monoflake/runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm install --frozen-lockfile
          mise run publish
      # What one runtime built is released though the other failed, and nothing where none built.
      - name: release
        if: ${{ !cancelled() }}
        working-directory: repos/monoflake/runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release

      # Docker Hub shows each image with this repository's readme and description, GitHub's kept.
      - name: description
        id: description
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "text=$(gh api "repos/$GITHUB_REPOSITORY" --jq .description)" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        if: ${{ !cancelled() }}
        with:
          username: canmi
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: canmi/workerd
          short-description: ${{ steps.description.outputs.text }}
          readme-filepath: repos/monoflake/runtime/README.md
          enable-url-completion: true
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        if: ${{ !cancelled() }}
        with:
          username: canmi
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: canmi/wasmtime
          short-description: ${{ steps.description.outputs.text }}
          readme-filepath: repos/monoflake/runtime/README.md
          enable-url-completion: true
