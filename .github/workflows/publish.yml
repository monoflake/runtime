# Each day, by hand, or on a push to main, builds each runtime upstream released past the release
# delay that no release here holds yet, and releases it here and on Docker Hub, .github/publish.
name: publish

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

# A run started while another builds waits behind it in order, up to a hundred deep, and none is
# canceled, so two never race to release one day, as rdm's nightly queues.
concurrency:
  group: publish
  queue: max

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The workspace above the repository, as it is checked out at home, whose mise.toml pins node.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: canmi21/canmi
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/monoflake/runtime
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          working_directory: repos/monoflake/runtime
      # The OCI exporter needs a builder of its own, which the docker driver is not.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Docker Hub takes each image under the author's own account, RFC m7rkq.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: canmi
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - working-directory: repos/monoflake/runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm install --frozen-lockfile
          mise run publish

      # Docker Hub shows each image with this repository's readme and description, GitHub's kept.
      - name: description
        id: description
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "text=$(gh api "repos/$GITHUB_REPOSITORY" --jq .description)" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        if: ${{ !cancelled() }}
        with:
          username: canmi
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: canmi/workerd
          short-description: ${{ steps.description.outputs.text }}
          readme-filepath: repos/monoflake/runtime/README.md
          enable-url-completion: true
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        if: ${{ !cancelled() }}
        with:
          username: canmi
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: canmi/wasmtime
          short-description: ${{ steps.description.outputs.text }}
          readme-filepath: repos/monoflake/runtime/README.md
          enable-url-completion: true
