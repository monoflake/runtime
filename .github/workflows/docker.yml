# Pushes the newest runtime released here to Docker Hub where it lacks it, woken by publish, by hand
# or each day after publish, scripts/publish.res.
name: docker

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

# One run at a time and never canceled, so two never race to push one tag.
concurrency:
  group: docker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The workspace above the repository, as it is checked out at home, whose mise.toml pins node.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: canmi21/canmi
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/monoflake/runtime
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          working_directory: repos/monoflake/runtime
      # Both architectures are pushed as one image, which the docker driver cannot build.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - working-directory: repos/monoflake/runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm install --frozen-lockfile
          mise run publish --docker
