# Each runtime serving what is mounted beside it, worker/ for workerd and component/ for wasmtime.
services:
  workerd:
    image: canmi/workerd
    # config.capnp listens on 25683, CLOUD typed on a phone's keypad.
    command: ["serve", "/worker/config.capnp"]
    volumes:
      - ./worker:/worker:ro
    ports:
      - "25683:25683"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  wasmtime:
    image: canmi/wasmtime
    # 24947 is 0x6173, the as of the magic bytes every WebAssembly file opens with.
    command: ["serve", "--addr", "0.0.0.0:24947", "/component/app.wasm"]
    volumes:
      - ./component:/component:ro
    ports:
      - "24947:24947"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
